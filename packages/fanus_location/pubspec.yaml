name: fanus_location
description: "Fanus konum katmanı: geofence takibi, izin akışı ve odak oturumu sırasında pil dostu arka plan konum takibi."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.samedaydin.fanus_location
        pluginClass: FanusLocationPlugin
      ios:
        pluginClass: FanusLocationPlugin
